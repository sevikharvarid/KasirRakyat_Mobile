name: kasir_rakyat
description: "Kasir Cepat, Usaha Lancar — offline-first POS untuk UMKM Indonesia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.6
  freezed_annotation: ^2.4.4
  get_it: ^7.7.0
  go_router: ^13.2.5
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  flutter_bluetooth_printer: ^2.20.0
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
