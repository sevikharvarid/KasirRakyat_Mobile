name: Android CI/CD

on:
  push:
    branches:
      - production
      
jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      SECRETS_TOKEN: ${{ secrets.SECRET_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: sevikharvarid/kasirrakyat-secrets
          ref: refs/heads/main
          token: ${{ env.SECRETS_TOKEN }}
          path: secrets
      
      - name: Copy build keys to project
        run: |
          cp secrets/Env/key.properties project/android/app/
          cp secrets/Env/kasir_rakyat.jks project/android/app/     
          cp secrets/Docker/Dockerfile project/  
      
      - name: Increment build number
        run: |
          cd project
          current_version_number=$(awk '/version:/ {print $2}' pubspec.yaml | cut -d'+' -f1)
          new_version="$current_version_number+$BUILD_NUMBER"
          echo "version: $new_version"
          sed -i "s/version: .*/version: $new_version/" pubspec.yaml     

      - name: Build Docker Image
        run: |
          cd project
          docker build -t flutter-apk .    
      
      - name: Extract Android APK File
        run: |
          cd project
          docker cp $(docker create --rm flutter-apk):/output/app-release.apk ./app-release.apk

      - name: Upload build to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: project/app-release.apk     

  deploy:
    runs-on: ubuntu-latest

    needs: build
    
    # environment: production

    env:
      BUILD_NUMBER: ${{ github.run_number }}
      SECRETS_TOKEN: ${{ secrets.SECRETS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: sevikharvarid/kasirrakyat-secrets
          ref: refs/heads/main
          token: ${{ secrets.SECRET_TOKEN }}
          path: secrets    

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: project    

      - name: Copy firebase service account
        run: |
          cp secrets/ServiceAccount/service-account.json project    

      - name: Copy Fastfile to project
        run: |
          cp -r secrets/fastlane project/

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 'ruby'
          bundler-cache: true
          working-directory: project/fastlane
      
      - name: Deploy with fastlane
        env:
          APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cd project
          cd fastlane
          bundle exec fastlane android distribute        

